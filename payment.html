<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pay with Binance — JISANs</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>:root{--g:#39ff88;--bg:#050806;--card:#0a110de8;--muted:#9aa9a0;--red:#ff6262}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#123d24,#050806 55%);color:#fff;font:15px Manrope,system-ui,sans-serif}.wrap{max-width:560px;margin:auto;padding:28px 18px 50px}.card{background:var(--card);border:1px solid #39ff8833;border-radius:24px;padding:24px;box-shadow:0 20px 70px #0008}h1{font-size:25px}.green{color:var(--g)}.muted{color:var(--muted);line-height:1.6}.binance{margin:20px 0}.binance-label{display:block;color:#9aa9a0;font-size:13px;font-weight:700;margin-bottom:7px}.binance-row{display:flex;gap:8px;align-items:center}.binance code{flex:1;padding:15px;border-radius:13px;background:#07100b;border:1px solid #294635;font-size:20px;letter-spacing:2px}.btn,input[type=file]{width:100%;padding:14px;border-radius:13px;border:1px solid #294635;background:#07100b;color:#fff}.btn{margin-top:12px;background:var(--g);color:#041008;font-weight:800;cursor:pointer;border:0}.msg{margin-top:14px;padding:13px;border-radius:12px;background:#101914;color:#c7d3cc;line-height:1.6}.msg.error{background:#2a0d0d;border:1px solid #7a2929;color:#ff9b9b}.upload-box{transition:.2s}.preview{max-width:100%;max-height:280px;margin-top:12px;border-radius:12px;display:none}.count{text-align:center;font-size:36px;font-weight:800;color:var(--g);margin:16px 0;font-variant-numeric:tabular-nums}.hide{display:none!important}</style></head><body><main class="wrap"><section class="card"><h1>💳 <span class="green">$50 Purchase</span></h1><p class="muted">Binance দিয়ে $50 payment সম্পন্ন করুন। Admin review করে access activate করবে।</p><div class="binance"><span class="binance-label">Binance ID</span><div class="binance-row"><code id="binance">853973504</code><button class="btn" style="width:auto;margin:0" id="copy">COPY</button></div></div><div id="uploadBox" class="upload-box"><input id="shot" type="file" accept="image/*"><img id="preview" class="preview"><button class="btn" id="submit">SUBMIT PAYMENT SCREENSHOT</button></div><div id="msg" class="msg">Payment session তৈরি হচ্ছে...</div><div id="active" class="hide"><h2>Payment Confirmed ✓</h2><p class="muted">আপনার purchase কনফার্ম হয়েছে। ৩ দিনের access countdown শুরু হয়েছে।</p><div id="count" class="count">03:00:00:00</div><a id="download" class="btn hide" href="#" style="display:block;text-align:center;text-decoration:none">BOT DOWNLOAD</a></div></section></main><script>const $=x=>document.getElementById(x);let pid=new URLSearchParams(location.search).get('id'),timer=null,pollTimer=null;function setMsg(text,error=false){$('msg').textContent=text;$('msg').classList.toggle('error',error)}async function create(){if(pid)return;const r=await fetch('/api/payment',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'create'})});const x=await r.json();pid=x.id;history.replaceState(null,'','/payment.html?id='+encodeURIComponent(pid));setMsg('Payment ID ready. Payment করার পর screenshot submit করুন।')}async function compress(file){return new Promise((resolve,reject)=>{const img=new Image(),reader=new FileReader();reader.onload=()=>{img.onload=()=>{const max=1400,scale=Math.min(1,max/img.width),c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.72))};img.src=reader.result};reader.onerror=reject;reader.readAsDataURL(file)})}$('copy').onclick=async()=>{await navigator.clipboard.writeText($('binance').textContent);setMsg('Binance ID copied ✓')};$('shot').onchange=()=>{const f=$('shot').files[0];if(f){$('preview').src=URL.createObjectURL(f);$('preview').style.display='block'}};$('submit').onclick=async()=>{const f=$('shot').files[0];if(!pid||!f){setMsg('Screenshot select করুন।',true);return}$('submit').disabled=true;setMsg('Uploading...');try{const data=await compress(f);const r=await fetch('/api/payment',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'submit',id:pid,screenshot:data})});const x=await r.json();if(!r.ok)throw new Error(x.error);$('uploadBox').classList.add('hide');setMsg('Screenshot submit হয়েছে। Admin review-এর অপেক্ষায় আছেন।');poll()}catch(e){setMsg(e.message,true);$('submit').disabled=false}};function startCountdown(exp){$('active').classList.remove('hide');if(timer)clearInterval(timer);function tick(){let ms=Math.max(0,new Date(exp).getTime()-Date.now()),t=Math.floor(ms/1000),d=Math.floor(t/86400);t%=86400;let h=Math.floor(t/3600);t%=3600;let m=Math.floor(t/60),s=t%60;$('count').textContent=`${String(d).padStart(2,'0')}:${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;if(ms<=0){clearInterval(timer);$('download').href='/api/download?payment='+encodeURIComponent(pid);$('download').classList.remove('hide')}}tick();timer=setInterval(tick,1000)}async function poll(){try{const r=await fetch('/api/payment?id='+encodeURIComponent(pid),{cache:'no-store'}),x=await r.json(),p=x.payment;if(!p){setMsg(x.error||'Payment status পাওয়া যায়নি।',true);return}if(p.status==='approved'){if(p.expires_at)startCountdown(p.expires_at);$('uploadBox').classList.add('hide');setMsg('আপনার payment কনফার্ম হয়েছে।');return}if(p.status==='rejected'){if(pollTimer)clearTimeout(pollTimer);$('uploadBox').classList.add('hide');$('active').classList.add('hide');setMsg('আপনার পেমেন্টটি সফল হয়নি। '+(p.reason||''),true);return}}catch(e){}pollTimer=setTimeout(poll,4000)}create().then(()=>poll());</script></body></html>
