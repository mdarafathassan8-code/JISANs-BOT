<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JISANs Refund Bot Admin</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>:root{--g:#39ff88;--muted:#9aa9a0}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#123d24 0,#050806 52%);color:#fff;font:15px Manrope,system-ui,sans-serif;max-width:1000px;padding:24px 16px 50px;margin:auto}h1{font-size:25px}.top{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.auth{display:flex;gap:8px;flex-wrap:wrap}.auth input,.auth button{padding:12px 14px;border-radius:12px;border:1px solid #294635;background:#0b120e;color:#fff}.auth button{background:var(--g);color:#041008;font-weight:800;cursor:pointer}.row{border:1px solid #294635;padding:16px;margin:12px 0;border-radius:16px;background:#0a110de8}.muted{color:var(--muted)}.error{color:#ff8f8f;border:1px solid #6b2929;padding:12px;border-radius:12px;margin-top:12px}.btn{padding:10px 13px;margin:8px 6px 0 0;border:0;border-radius:10px;background:var(--g);color:#031008;font-weight:800;cursor:pointer}.danger{background:#ff6868}.thumb{display:block;max-width:260px;max-height:260px;border-radius:12px;margin:12px 0;border:1px solid #294635}.notice,.push{padding:12px 14px;border:1px solid #39ff8844;background:#0b1b11;border-radius:12px;margin:14px 0}.push button{margin-top:8px;padding:10px 13px;border:0;border-radius:10px;background:var(--g);color:#031008;font-weight:800}</style></head><body><div class="top"><div><h1>JISANs REFUND BOT — ADMIN</h1><div class="muted">Payment & Trader Request Review</div></div><div class="auth"><input id="key" type="password" placeholder="Admin Key" autocomplete="current-password"><button id="loginBtn">LOGIN</button><button id="logoutBtn" style="display:none">LOGOUT</button></div></div><div id="list"></div><script>const $=x=>document.getElementById(x),list=$('list'),key=$('key');let timer=null,swRegistration=null;const saved=localStorage.getItem('jisans_admin_key');if(saved)key.value=saved;function token(){return key.value.trim()}async function registerSW(){if(!('serviceWorker'in navigator))return null;try{swRegistration=await navigator.serviceWorker.register('/sw.js',{scope:'/'});await navigator.serviceWorker.ready;return swRegistration}catch(e){console.warn('Service worker registration failed',e);return null}}function urlBase64ToUint8Array(base64String){const padding='='.repeat((4-base64String.length%4)%4);const base64=(base64String+padding).replace(/-/g,'+').replace(/_/g,'/');const raw=atob(base64);return Uint8Array.from([...raw].map(c=>c.charCodeAt(0)))}async function enablePush(){try{if(!('serviceWorker'in navigator)||!('PushManager'in window)){return 'এই browser Web Push support করে না।'}const p=await Notification.requestPermission();if(p!=='granted')return 'Phone notification permission Allow করতে হবে।';const r=await registerSW();if(!r)return 'Service Worker চালু করা যায়নি।';const pk=await fetch('/api/push?action=publicKey',{cache:'no-store'}).then(x=>x.json());if(!pk.publicKey)return 'VAPID public key configured নেই।';let sub=await r.pushManager.getSubscription();if(!sub)sub=await r.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlBase64ToUint8Array(pk.publicKey)});const savedSub=await fetch('/api/push',{method:'POST',headers:{'Content-Type':'application/json',authorization:'Bearer '+token()},body:JSON.stringify({subscription:sub.toJSON()})});if(!savedSub.ok){const e=await savedSub.json();return e.error||'Push subscription failed';}return 'ok'}catch(e){console.error(e);return e.message||'Notification setup failed'}}async function readResponse(r){const t=await r.text();let d;try{d=JSON.parse(t)}catch{throw new Error(`Server returned HTTP ${r.status}`)}if(!r.ok)throw new Error(d.error||`Server returned HTTP ${r.status}`);return d}async function load(){if(!token()){list.innerHTML='<p class="error">Admin Key দিন।</p>';return}try{const r=await fetch('/api/admin',{headers:{authorization:'Bearer '+token()},cache:'no-store'});const x=await readResponse(r);localStorage.setItem('jisans_admin_key',token());$('loginBtn').style.display='none';$('logoutBtn').style.display='inline-block';const payments=x.payments||[],requests=x.requests||[],pendingPayments=payments.filter(p=>p.status==='pending').length,pendingRequests=requests.filter(a=>a.status==='pending').length;let html='<div class="notice">🔔 Pending Payments: <b>'+pendingPayments+'</b> · Pending Trader Requests: <b>'+pendingRequests+'</b></div>';if(Notification&&Notification.permission!=='granted')html+='<div class="push">📱 ফোনের notification চালু করতে <button onclick="setupPush()">ENABLE PHONE NOTIFICATIONS</button></div>';html+='<h2>Payments</h2>';html+=payments.length?payments.map(p=>`<div class="row"><b>$${p.amount}</b> · <span class="muted">${p.id}</span><div class="muted">${p.status}${p.reason?' — '+p.reason:''}</div>${p.screenshot?`<img class="thumb" src="${p.screenshot}" alt="Payment screenshot">`:''}${p.status==='pending'?`<button class="btn" onclick="act('${p.id}','payment_accept')">ACCEPT</button><button class="btn danger" onclick="act('${p.id}','payment_reject')">REJECT</button>`:''}</div>`).join(''):'<p class="muted">No payments yet.</p>';html+='<h2>Trader ID Requests</h2>';html+=requests.length?requests.map(a=>`<div class="row"><b>${a.id}</b><div class="muted">${a.status}${a.reason?' — '+a.reason:''}</div>${a.status==='pending'?`<button class="btn" onclick="act('${a.id}','accept')">ACCEPT</button><button class="btn danger" onclick="act('${a.id}','reject_link')">REJECT 1</button><button class="btn danger" onclick="act('${a.id}','reject_deposit')">REJECT 2</button>`:''}</div>`).join(''):'<p class="muted">No requests yet.</p>';list.innerHTML=html;if(!timer)timer=setInterval(load,5000)}catch(e){if(e.message.includes('Admin Key')){localStorage.removeItem('jisans_admin_key');key.value='';$('loginBtn').style.display='inline-block';$('logoutBtn').style.display='none'}list.innerHTML='<p class="error">'+e.message+'</p>'}}async function setupPush(){const result=await enablePush();if(result==='ok'){await load();alert('Phone notification successfully enabled ✓')}else alert(result)}async function act(id,action){try{const r=await fetch('/api/admin',{method:'POST',headers:{'Content-Type':'application/json',authorization:'Bearer '+token()},body:JSON.stringify({id,action})});await readResponse(r);await load()}catch(e){list.innerHTML='<p class="error">'+e.message+'</p>'}}$('loginBtn').onclick=async()=>{if(!token())return;localStorage.setItem('jisans_admin_key',token());await load();const result=await enablePush();if(result!=='ok')alert(result)};$('logoutBtn').onclick=()=>{localStorage.removeItem('jisans_admin_key');key.value='';if(timer)clearInterval(timer);timer=null;$('loginBtn').style.display='inline-block';$('logoutBtn').style.display='none';list.innerHTML='<p class="muted">Logged out.</p>'};registerSW().finally(()=>{if(saved)load()});</script></body></html>
