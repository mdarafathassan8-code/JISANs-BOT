<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JISANs Refund Bot Admin</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>:root{--g:#39ff88;--bg:#050806;--muted:#9aa9a0}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#123d24 0,#050806 52%);color:#fff;font:15px Manrope,system-ui,sans-serif;max-width:1000px;padding:24px 16px 50px;margin:auto}h1{font-size:25px}.top{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.auth{display:flex;gap:8px;flex-wrap:wrap}.auth input,.auth button{padding:12px 14px;border-radius:12px;border:1px solid #294635;background:#0b120e;color:#fff}.auth button{background:var(--g);color:#041008;font-weight:800;cursor:pointer}.row{border:1px solid #294635;padding:16px;margin:12px 0;border-radius:16px;background:#0a110de8}.muted{color:var(--muted)}.error{color:#ff8f8f;border:1px solid #6b2929;padding:12px;border-radius:12px;margin-top:12px}.btn{padding:10px 13px;margin:8px 6px 0 0;border:0;border-radius:10px;background:var(--g);color:#031008;font-weight:800;cursor:pointer}.danger{background:#ff6868}.thumb{display:block;max-width:260px;max-height:260px;border-radius:12px;margin:12px 0;border:1px solid #294635}.notice{padding:12px 14px;border:1px solid #39ff8844;background:#0b1b11;border-radius:12px;margin:14px 0}</style></head><body><div class="top"><div><h1>JISANs REFUND BOT — ADMIN</h1><div class="muted">Payment & Trader Request Review</div></div><div class="auth"><input id="key" type="password" placeholder="Admin Key" autocomplete="current-password"><button id="loginBtn">LOGIN</button><button id="logoutBtn" style="display:none">LOGOUT</button></div></div><div id="list"></div><script>const $=x=>document.getElementById(x),list=$('list'),key=$('key');let timer=null,lastPaymentCount=-1;const saved=localStorage.getItem('jisans_admin_key');if(saved)key.value=saved;function token(){return key.value.trim()}async function readResponse(r){const t=await r.text();let d;try{d=JSON.parse(t)}catch{throw new Error(`Server returned HTTP ${r.status}`)}if(!r.ok)throw new Error(d.error||`Server returned HTTP ${r.status}`);return d}async function load(){if(!token()){list.innerHTML='<p class="error">Admin Key দিন।</p>';return}try{const r=await fetch('/api/admin',{headers:{authorization:'Bearer '+token()},cache:'no-store'});const x=await readResponse(r);localStorage.setItem('jisans_admin_key',token());$('loginBtn').style.display='none';$('logoutBtn').style.display='inline-block';const payments=x.payments||[],pendingPayments=payments.filter(p=>p.status==='pending');if(lastPaymentCount>=0&&pendingPayments.length>lastPaymentCount&&'Notification'in window&&Notification.permission==='granted')new Notification('JISANs BOT',{body:'নতুন payment review এসেছে।'});lastPaymentCount=pendingPayments.length;let html='<div class="notice">🔔 Pending Payments: <b>'+pendingPayments.length+'</b></div><h2>Payments</h2>';html+=payments.length?payments.map(p=>`<div class="row"><b>$${p.amount}</b> · <span class="muted">${p.id}</span><div class="muted">${p.status}${p.reason?' — '+p.reason:''}</div>${p.screenshot?`<img class="thumb" src="${p.screenshot}" alt="Payment screenshot">`:''}${p.status==='pending'?`<button class="btn" onclick="act('${p.id}','payment_accept')">ACCEPT</button><button class="btn danger" onclick="act('${p.id}','payment_reject')">REJECT</button>`:''}</div>`).join(''):'<p class="muted">No payments yet.</p>';html+='<h2>Trader ID Requests</h2>';html+=x.requests?.length?x.requests.map(a=>`<div class="row"><b>${a.id}</b><div class="muted">${a.status}${a.reason?' — '+a.reason:''}</div>${a.status==='pending'?`<button class="btn" onclick="act('${a.id}','accept')">ACCEPT</button><button class="btn danger" onclick="act('${a.id}','reject_link')">REJECT 1</button><button class="btn danger" onclick="act('${a.id}','reject_deposit')">REJECT 2</button>`:''}</div>`).join(''):'<p class="muted">No requests yet.</p>';list.innerHTML=html;if(!timer)timer=setInterval(load,5000)}catch(e){if(e.message.includes('Admin Key')){localStorage.removeItem('jisans_admin_key');key.value='';$('loginBtn').style.display='inline-block';$('logoutBtn').style.display='none'}list.innerHTML='<p class="error">'+e.message+'</p>'}}async function act(id,action){try{const r=await fetch('/api/admin',{method:'POST',headers:{'Content-Type':'application/json',authorization:'Bearer '+token()},body:JSON.stringify({id,action})});await readResponse(r);await load()}catch(e){list.innerHTML='<p class="error">'+e.message+'</p>'}}$('loginBtn').onclick=async()=>{if(!token())return;localStorage.setItem('jisans_admin_key',token());if('Notification'in window&&Notification.permission==='default')await Notification.requestPermission();lastPaymentCount=-1;await load()};$('logoutBtn').onclick=()=>{localStorage.removeItem('jisans_admin_key');key.value='';if(timer)clearInterval(timer);timer=null;lastPaymentCount=-1;$('loginBtn').style.display='inline-block';$('logoutBtn').style.display='none';list.innerHTML='<p class="muted">Logged out.</p>'};if(saved)load();</script></body></html>
