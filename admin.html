<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JISANs Refund Bot Admin</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>:root{--g:#39ff88;--muted:#9aa9a0}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#123d24 0,#050806 52%);color:#fff;font:15px Manrope,system-ui,sans-serif;max-width:1100px;padding:24px 16px 50px;margin:auto}h1{font-size:25px}.top{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.auth{display:flex;gap:8px;flex-wrap:wrap}.auth input,.auth button{padding:12px 14px;border-radius:12px;border:1px solid #294635;background:#0b120e;color:#fff}.auth button{background:var(--g);color:#041008;font-weight:800;cursor:pointer}.row{border:1px solid #294635;padding:16px;margin:12px 0;border-radius:16px;background:#0a110de8}.muted{color:var(--muted)}.error{color:#ff8f8f;border:1px solid #6b2929;padding:12px;border-radius:12px;margin-top:12px}.btn{padding:10px 13px;margin:8px 6px 0 0;border:0;border-radius:10px;background:var(--g);color:#031008;font-weight:800;cursor:pointer}.danger{background:#ff6868}.refresh{background:#dfffea}.thumb{display:block;width:auto;max-width:min(100%,520px);max-height:520px;border-radius:12px;margin:12px 0;border:1px solid #294635;background:#050806;object-fit:contain}.notice{padding:12px 14px;border:1px solid #39ff8844;background:#0b1b11;border-radius:12px;margin:14px 0}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.tab{flex:1;min-width:130px;padding:13px 12px;border:1px solid #294635;border-radius:12px;background:#07100b;color:#fff;font-weight:800;cursor:pointer}.tab.active{background:var(--g);color:#031008}.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;margin-top:10px}.meta>div{padding:10px 12px;border-radius:10px;background:#07100b;border:1px solid #1d3024}.ref{padding:10px 12px;border:1px solid #294635;background:#07100b;border-radius:10px;margin:10px 0;word-break:break-all}.status{font-weight:800;text-transform:uppercase}.empty{text-align:center;padding:30px;border:1px dashed #294635;border-radius:14px;color:var(--muted)}</style></head><body><div class="top"><div><h1>JISANs REFUND BOT — ADMIN</h1><div class="muted">PAYMENT & TRADER REQUEST REVIEW</div></div><div class="auth"><input id="key" type="password" placeholder="Admin Key" autocomplete="current-password"><button id="loginBtn">LOGIN</button><button id="logoutBtn" style="display:none">LOGOUT</button></div></div><div id="list"></div><script>const $=x=>document.getElementById(x),list=$('list'),key=$('key');let timer=null,swRegistration=null,activeTab='pending',payments=[],requests=[];const saved=localStorage.getItem('jisans_admin_key');if(saved)key.value=saved;function token(){return key.value.trim()}function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}async function registerSW(){if(!('serviceWorker'in navigator))return null;try{swRegistration=await navigator.serviceWorker.register('/sw.js',{scope:'/'});await navigator.serviceWorker.ready;return swRegistration}catch(e){return null}}function urlBase64ToUint8Array(s){const p='='.repeat((4-s.length%4)%4),b=(s+p).replace(/-/g,'+').replace(/_/g,'/'),r=atob(b);return Uint8Array.from([...r].map(c=>c.charCodeAt(0)))}async function enablePush(){try{if(!('serviceWorker'in navigator)||!('PushManager'in window))return 'This browser does not support Web Push.';const p=await Notification.requestPermission();if(p!=='granted')return 'Please allow phone notification permission.';const r=await registerSW();if(!r)return 'Service Worker could not be started.';const pk=await fetch('/api/push?action=publicKey',{cache:'no-store'}).then(x=>x.json());if(!pk.publicKey)return 'VAPID public key is not configured.';let sub=await r.pushManager.getSubscription();if(!sub)sub=await r.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlBase64ToUint8Array(pk.publicKey)});const savedSub=await fetch('/api/push',{method:'POST',headers:{'Content-Type':'application/json',authorization:'Bearer '+token()},body:JSON.stringify({subscription:sub.toJSON()})});if(!savedSub.ok){const e=await savedSub.json();return e.error||'Push subscription failed'}return'ok'}catch(e){return e.message||'Notification setup failed'}}async function readResponse(r){const t=await r.text();let d;try{d=JSON.parse(t)}catch{throw new Error(`Server returned HTTP ${r.status}`)}if(!r.ok)throw new Error(d.error||`Server returned HTTP ${r.status}`);return d}function counts(){return{pp:payments.filter(x=>x.status==='pending').length,pa:payments.filter(x=>x.status==='approved').length,pr:payments.filter(x=>x.status==='rejected').length,rp:requests.filter(x=>x.status==='pending').length,ra:requests.filter(x=>x.status==='approved').length,rr:requests.filter(x=>x.status==='rejected').length}}function render(){const c=counts();let items=[];if(activeTab==='pending')items=[...payments.filter(x=>x.status==='pending').map(x=>({...x,_type:'payment'})),...requests.filter(x=>x.status==='pending').map(x=>({...x,_type:'request'}))].sort((a,b)=>Number(b.created_at||0)-Number(a.created_at||0));if(activeTab==='accepted')items=[...payments.filter(x=>x.status==='approved').map(x=>({...x,_type:'payment'})),...requests.filter(x=>x.status==='approved').map(x=>({...x,_type:'request'}))].sort((a,b)=>Number(b.created_at||0)-Number(a.created_at||0));if(activeTab==='rejected')items=[...payments.filter(x=>x.status==='rejected').map(x=>({...x,_type:'payment'})),...requests.filter(x=>x.status==='rejected').map(x=>({...x,_type:'request'}))].sort((a,b)=>Number(b.created_at||0)-Number(a.created_at||0));let html=`<div class="notice">PENDING: <b>${c.pp+c.rp}</b> · ACCEPTED: <b>${c.pa+c.ra}</b> · REJECTED: <b>${c.pr+c.rr}</b><br><button class="btn refresh" onclick="load()">↻ REFRESH</button> <span class="muted">${new Date().toLocaleTimeString()}</span></div>`;if(Notification&&Notification.permission!=='granted')html+='<div class="notice">📱 PHONE NOTIFICATIONS <button class="btn" onclick="setupPush()">ENABLE PHONE NOTIFICATIONS</button></div>';html+=`<div class="tabs"><button class="tab ${activeTab==='pending'?'active':''}" onclick="switchTab('pending')">PENDING (${c.pp+c.rp})</button><button class="tab ${activeTab==='accepted'?'active':''}" onclick="switchTab('accepted')">ACCEPTED (${c.pa+c.ra})</button><button class="tab ${activeTab==='rejected'?'active':''}" onclick="switchTab('rejected')">REJECTED (${c.pr+c.rr})</button></div>`;html+=items.length?items.map(renderItem).join(''):`<div class="empty">NO ${activeTab.toUpperCase()} REQUESTS</div>`;list.innerHTML=html}function renderItem(x){const pending=x.status==='pending';if(x._type==='payment')return `<div class="row"><b>PAYMENT — $${esc(x.amount)}</b> · <span class="muted">${esc(x.id)}</span><div class="meta"><div><span class="muted">STATUS</span><br><span class="status">${esc(x.status)}</span>${x.reason?' — '+esc(x.reason):''}</div><div><span class="muted">REFERENCE / TXID</span><br><b>${esc(x.payment_reference||'NOT PROVIDED')}</b></div></div>${pending&&x.screenshot?`<div class="muted" style="margin-top:12px">PAYMENT SCREENSHOT</div><a href="${esc(x.screenshot)}" target="_blank" rel="noopener"><img class="thumb" src="${esc(x.screenshot)}" alt="Payment screenshot"></a>`:''}${pending&&!x.screenshot?'<div class="error">NO PAYMENT SCREENSHOT RECEIVED</div>':''}${pending?`<button class="btn" onclick="act('${esc(x.id)}','payment_accept')">ACCEPT</button><button class="btn danger" onclick="act('${esc(x.id)}','payment_reject')">REJECT</button>`:''}</div>`;return `<div class="row"><b>TRADER ID — ${esc(x.id)}</b><div class="muted">STATUS: <span class="status">${esc(x.status)}</span>${x.reason?' — '+esc(x.reason):''}</div>${pending?`<button class="btn" onclick="act('${esc(x.id)}','accept')">ACCEPT</button><button class="btn danger" onclick="act('${esc(x.id)}','reject_link')">REJECT 1</button><button class="btn danger" onclick="act('${esc(x.id)}','reject_deposit')">REJECT 2</button>`:''}</div>`}function switchTab(t){activeTab=t;render()}async function load(){if(!token()){list.innerHTML='<p class="error">ENTER ADMIN KEY.</p>';return}try{const r=await fetch('/api/admin',{headers:{authorization:'Bearer '+token()},cache:'no-store'});const x=await readResponse(r);payments=x.payments||[];requests=x.requests||[];localStorage.setItem('jisans_admin_key',token());$('loginBtn').style.display='none';$('logoutBtn').style.display='inline-block';render()}catch(e){if(e.message.includes('Admin Key')){localStorage.removeItem('jisans_admin_key');key.value='';$('loginBtn').style.display='inline-block';$('logoutBtn').style.display='none'}list.innerHTML='<p class="error">'+esc(e.message)+'</p>'}}async function setupPush(){const result=await enablePush();if(result==='ok'){await load();alert('PHONE NOTIFICATION SUCCESSFULLY ENABLED ✓')}else alert(result)}async function act(id,action){try{const r=await fetch('/api/admin',{method:'POST',headers:{'Content-Type':'application/json',authorization:'Bearer '+token()},body:JSON.stringify({id,action})});await readResponse(r);await load()}catch(e){list.innerHTML='<p class="error">'+esc(e.message)+'</p>'}}$('loginBtn').onclick=async()=>{if(!token())return;localStorage.setItem('jisans_admin_key',token());await load();const result=await enablePush();if(result!=='ok'&&result!=='This browser does not support Web Push.')alert(result)};$('logoutBtn').onclick=()=>{localStorage.removeItem('jisans_admin_key');key.value='';if(timer)clearInterval(timer);timer=null;$('loginBtn').style.display='inline-block';$('logoutBtn').style.display='none';list.innerHTML='<p class="muted">LOGGED OUT.</p>'};registerSW().finally(()=>{if(saved)load()});</script></body></html>
