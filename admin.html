<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JISANs Refund Bot Admin</title>
<style>
body{background:#050806;color:#fff;font:15px Arial;padding:20px;max-width:900px;margin:auto}
input,button{padding:12px;margin:4px;border-radius:8px;border:1px solid #284333;background:#0b120e;color:white}
button{cursor:pointer;background:#39ff88;color:#031008;font-weight:bold}
button:disabled{opacity:.55;cursor:wait}
.row{border:1px solid #294635;padding:15px;margin:10px 0;border-radius:12px}
.muted{color:#9aa9a0}
.error{color:#ff8f8f;border:1px solid #6b2929;padding:12px;border-radius:8px;margin-top:12px}
.ok{color:#7dffb0}
</style>
<h1>JISANs REFUND BOT — ADMIN</h1>
<input id="key" type="password" placeholder="Admin Key" autocomplete="off">
<button id="loadBtn" onclick="load()">LOAD</button>
<div id="list"></div>
<script>
const list=document.getElementById('list');
const key=document.getElementById('key');
const loadBtn=document.getElementById('loadBtn');
const token=()=>key.value.trim();

async function readResponse(r){
  const text=await r.text();
  let data;
  try{data=JSON.parse(text)}catch{throw new Error(`Server returned HTTP ${r.status}`)}
  if(!r.ok) throw new Error(data.error||`Server returned HTTP ${r.status}`);
  return data;
}

async function load(){
  if(!token()){list.innerHTML='<p class="error">Admin Key দিন।</p>';return}
  loadBtn.disabled=true;list.innerHTML='<p class="muted">Loading…</p>';
  try{
    const controller=new AbortController();
    const timer=setTimeout(()=>controller.abort(),10000);
    const r=await fetch('/api/admin',{headers:{authorization:'Bearer '+token()},signal:controller.signal});
    clearTimeout(timer);
    const x=await readResponse(r);
    if(!x.requests?.length){list.innerHTML='<p class="muted">No requests yet.</p>';return}
    list.innerHTML=x.requests.map(a=>`<div class="row"><b>${a.id}</b><div class="muted">${a.status}${a.reason?' — '+a.reason:''}</div>${a.status==='pending'?`<button onclick="act('${a.id}','accept')">ACCEPT</button><button onclick="act('${a.id}','reject_link')">REJECT 1</button><button onclick="act('${a.id}','reject_deposit')">REJECT 2</button>`:''}</div>`).join('');
  }catch(e){
    list.innerHTML='<p class="error">'+(e.name==='AbortError'?'Request timed out. Check Turso URL/token and redeploy.':e.message)+'</p>';
  }finally{loadBtn.disabled=false}
}

async function act(id,action){
  try{
    const r=await fetch('/api/admin',{method:'POST',headers:{'Content-Type':'application/json',authorization:'Bearer '+token()},body:JSON.stringify({id,action})});
    await readResponse(r); await load();
  }catch(e){list.innerHTML='<p class="error">'+e.message+'</p>'}
}
</script>
