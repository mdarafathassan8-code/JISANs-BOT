<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jisan Admin</title><style>body{background:#050806;color:#fff;font:15px Arial;padding:20px}input,button{padding:12px;margin:4px;border-radius:8px;border:1px solid #284333;background:#0b120e;color:white}button{cursor:pointer;background:#39ff88;color:#031008;font-weight:bold}.row{border:1px solid #294635;padding:15px;margin:10px 0;border-radius:12px}.muted{color:#9aa9a0}</style><h1>JISAN REFUND BOT — ADMIN</h1><input id="key" type="password" placeholder="Admin Key"><button onclick="load()">LOAD</button><div id="list"></div><script>let token=()=>document.getElementById('key').value;async function load(){let r=await fetch('/api/admin',{headers:{authorization:'Bearer '+token()}}),x=await r.json();if(x.error)return list.innerHTML='<p>'+x.error+'</p>';list.innerHTML=x.requests.map(a=>`<div class=row><b>${a.id}</b><div class=muted>${a.status}</div>${a.status==='pending'?`<button onclick="act('${a.id}','accept')">ACCEPT</button><button onclick="act('${a.id}','reject_link')">REJECT 1</button><button onclick="act('${a.id}','reject_deposit')">REJECT 2</button>`:''}</div>`).join('')}async function act(id,action){await fetch('/api/admin',{method:'POST',headers:{'Content-Type':'application/json',authorization:'Bearer '+token()},body:JSON.stringify({id,action})});load()}</script>
