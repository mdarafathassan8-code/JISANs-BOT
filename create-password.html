<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Password — JISANs</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>:root{--g:#39ff88;--muted:#9aa9a0}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#123d24,#050806 55%);color:#fff;font:15px Manrope,system-ui,sans-serif}.wrap{max-width:560px;margin:auto;padding:28px 18px}.card{background:#0a110de8;border:1px solid #39ff8833;border-radius:24px;padding:24px;box-shadow:0 20px 70px #0008}h1{font-size:25px}.green{color:var(--g)}.muted{color:var(--muted);line-height:1.6}.label{display:block;color:var(--muted);font-size:13px;font-weight:800;margin:16px 0 7px}input,button{width:100%;padding:15px;border-radius:13px;border:1px solid #294635;background:#07100b;color:#fff}input{text-align:center;font-size:22px;letter-spacing:5px}button{margin-top:16px;background:var(--g);color:#041008;font-weight:800;cursor:pointer;border:0}.msg{margin-top:14px;padding:13px;border-radius:12px;background:#101914;color:#c7d3cc;line-height:1.6}.error{background:#2a0d0d;border:1px solid #7a2929;color:#ff9b9b}</style></head><body><main class="wrap"><section class="card"><h1>🔐 <span class="green">Create Password</span></h1><p class="muted">আপনার payment কনফার্ম হয়েছে। এখন ৮ সংখ্যার একটি password তৈরি করুন। পরবর্তীতে এই password দিয়েই access পাওয়া যাবে।</p><label class="label">Password তৈরি করুন</label><input id="p1" inputmode="numeric" maxlength="8" placeholder="৮ সংখ্যার Password"><label class="label">Confirm Password</label><input id="p2" inputmode="numeric" maxlength="8" placeholder="Password আবার দিন"><button id="save">CREATE PASSWORD</button><div id="msg" class="msg">Password অবশ্যই ঠিক ৮ সংখ্যার হতে হবে।</div></section></main><script>const $=x=>document.getElementById(x),id=new URLSearchParams(location.search).get('id');for(const el of [$('p1'),$('p2')])el.oninput=e=>e.target.value=e.target.value.replace(/\D/g,'').slice(0,8);$('save').onclick=async()=>{const password=$('p1').value,confirm=$('p2').value;if(!id){$('msg').textContent='Payment ID পাওয়া যায়নি।';$('msg').classList.add('error');return}if(password.length!==8){$('msg').textContent='Password অবশ্যই ঠিক ৮ সংখ্যার হতে হবে।';$('msg').classList.add('error');return}if(password!==confirm){$('msg').textContent='Confirm password মিলেনি।';$('msg').classList.add('error');return}$('save').disabled=true;$('msg').classList.remove('error');$('msg').textContent='Password তৈরি হচ্ছে...';try{const r=await fetch('/api/access',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'create',id,password,confirm})});const x=await r.json();if(!r.ok)throw new Error(x.error||'Password create failed');location.href='/payment.html?id='+encodeURIComponent(id)}catch(e){$('msg').textContent=e.message;$('msg').classList.add('error');$('save').disabled=false}};</script></body></html>
